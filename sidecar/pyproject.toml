[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dshv"
version = "0.1.0"
description = "dsh-vdesktop Python sidecar: virtual-desktop GUI agent execution plane (pure ctypes, no GDI+)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dshv-sidecar = "dshv.__main__:main"

[tool.setuptools]
packages = ["dshv", "dshv.win32"]

[tool.pytest.ini_options]
testpaths = ["tests"]